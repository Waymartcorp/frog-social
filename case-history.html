<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Frog Social · Case History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    :root {
      --app-shell-bg: #050810;
      --app-body-bg: #0B1020;
      --card-bg: #111827;
      --card-border: #1F2937;
      --primary-text: #F9FAFB;
      --secondary-text: #9CA3AF;
      --accent-green: #34D399;
      --accent-cyan: #38BDF8;
      --warning: #F97316;
      --danger: #EF4444;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: var(--app-body-bg);
      color: var(--primary-text);
      min-height: 100vh;
    }

    /* Navigation */
    .nav-bar {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding: 12px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--primary-text);
      text-decoration: none;
    }
    .nav-brand span { font-size: 1.25rem; }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-links a {
      font-size: 0.875rem;
      color: var(--secondary-text);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 9999px;
      transition: all 0.15s ease;
    }
    .nav-links a:hover {
      background: rgba(255,255,255,0.05);
      color: var(--primary-text);
    }
    .nav-links a.active {
      color: #6EE7B7;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.4);
    }
    .nav-signout {
      background: #1E293B;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--primary-text);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.15s;
      text-decoration: none;
    }
    .nav-signout:hover { background: #334155; }

    /* Page container */
    .page-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 32px;
    }
    .page-header {
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
    }
    .page-header-text h1 {
      font-size: 1.875rem;
      font-weight: 600;
      margin: 0 0 8px 0;
    }
    .page-header-text p {
      color: var(--secondary-text);
      font-size: 0.9rem;
      margin: 0;
      max-width: 600px;
    }

    /* Filter tabs */
    .filter-tabs {
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px;
      border-radius: 12px;
    }
    .search-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .search-row input {
      min-width: 320px;
      background: #0F172A;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 0.82rem;
      color: var(--primary-text);
    }
    .search-row .hint {
      font-size: 0.74rem;
      color: var(--secondary-text);
      width: 100%;
    }
    .filter-tab {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--secondary-text);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-tab:hover {
      color: var(--primary-text);
    }
    .filter-tab.active {
      background: rgba(52, 211, 153, 0.15);
      color: var(--accent-green);
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .stat-item {
      background: rgba(17, 24, 39, 0.7);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 16px 24px;
      min-width: 140px;
    }
    .stat-value {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--primary-text);
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--secondary-text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 4px;
    }
    .stat-item.open .stat-value { color: var(--warning); }
    .stat-item.resolved .stat-value { color: var(--accent-green); }
    .archive-note {
      width: 100%;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.26);
      color: #bae6fd;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.78rem;
      line-height: 1.45;
    }

    /* Case list */
    .case-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Case card */
    .case-card {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      transition: border-color 0.15s;
    }
    .case-card:hover {
      border-color: rgba(52, 211, 153, 0.4);
    }
    .case-card.resolved {
      border-left: 3px solid var(--accent-green);
    }
    .case-card.open {
      border-left: 3px solid var(--warning);
    }
    .case-card.monitoring {
      border-left: 3px solid var(--accent-cyan);
    }

    .case-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .case-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--primary-text);
      margin: 0;
    }
    .case-meta {
      font-size: 0.75rem;
      color: var(--secondary-text);
      margin-top: 4px;
    }
    .case-status {
      font-size: 0.7rem;
      padding: 4px 12px;
      border-radius: 9999px;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .case-status.open {
      background: rgba(251, 146, 60, 0.2);
      color: #FB923C;
    }
    .case-status.resolved {
      background: rgba(52, 211, 153, 0.2);
      color: var(--accent-green);
    }
    .case-status.monitoring {
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent-cyan);
    }
    .case-status.unresolved {
      background: rgba(251, 146, 60, 0.2);
      color: #FB923C;
    }
    .case-status.needs_followup {
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent-cyan);
    }

    .case-description {
      font-size: 0.875rem;
      color: var(--secondary-text);
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .report-block {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .report-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--secondary-text);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .report-body {
      font-size: 0.83rem;
      color: var(--primary-text);
      line-height: 1.55;
    }
    .report-list {
      margin: 0;
      padding-left: 16px;
      color: var(--primary-text);
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .report-list li {
      margin-bottom: 4px;
    }
    .case-report-layout {
      display: grid;
      grid-template-columns: 1.4fr 0.9fr;
      gap: 12px;
      align-items: start;
    }
    .full-status-window {
      position: sticky;
      top: 84px;
    }
    @media (max-width: 1024px) {
      .case-report-layout {
        grid-template-columns: 1fr;
      }
      .full-status-window {
        position: static;
      }
    }
    .case-detail-hint {
      font-size: 0.75rem;
      color: var(--secondary-text);
      margin-top: -6px;
      margin-bottom: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Resolution section */
    .resolution-section {
      background: rgba(52, 211, 153, 0.08);
      border: 1px solid rgba(52, 211, 153, 0.2);
      border-radius: 12px;
      padding: 14px 18px;
      margin-top: 16px;
    }
    .resolution-header {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-green);
      margin-bottom: 8px;
    }
    .resolution-text {
      font-size: 0.85rem;
      color: var(--primary-text);
      line-height: 1.5;
    }
    .follow-up-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(52, 211, 153, 0.2);
    }
    .follow-up-header {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-cyan);
      margin-bottom: 6px;
    }
    .follow-up-text {
      font-size: 0.8rem;
      color: var(--secondary-text);
    }

    /* Case actions */
    .case-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .btn-secondary {
      background: #1E293B;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--primary-text);
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-secondary:hover {
      background: #334155;
    }
    .btn-resolve {
      background: var(--accent-green);
      color: #0F172A;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 9999px;
      border: none;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .btn-resolve:hover {
      background: #6EE7B7;
    }

    /* Resolution form (modal-like inline) */
    .resolution-form {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 12px;
      padding: 16px 20px;
      margin-top: 16px;
      display: none;
    }
    .resolution-form.active {
      display: block;
    }
    .resolution-form label {
      display: block;
      font-size: 0.8rem;
      color: var(--secondary-text);
      margin-bottom: 6px;
      margin-top: 12px;
    }
    .resolution-form label:first-child {
      margin-top: 0;
    }
    .resolution-form textarea,
    .resolution-form input {
      width: 100%;
      background: #0F172A;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: var(--primary-text);
    }
    .resolution-form textarea {
      min-height: 80px;
      resize: vertical;
    }
    .resolution-form textarea:focus,
    .resolution-form input:focus {
      outline: none;
      border-color: var(--accent-green);
    }
    .resolution-form-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    /* Tags row */
    .case-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 500;
    }
    .tag.system {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-cyan);
    }
    .tag.husbandry {
      background: rgba(52, 211, 153, 0.15);
      color: var(--accent-green);
    }
    .tag.social {
      background: rgba(251, 146, 60, 0.15);
      color: var(--warning);
    }
    .tag.paste {
      background: rgba(148, 163, 184, 0.2);
      color: #CBD5F5;
    }

    .case-detail {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px 18px;
      margin-top: 14px;
      display: none;
    }
    .case-detail-header {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--secondary-text);
      margin-bottom: 8px;
    }
    .case-detail-body {
      font-size: 0.85rem;
      color: var(--primary-text);
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .case-card.expanded .case-detail {
      display: block;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--secondary-text);
    }
    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }
    .empty-state h3 {
      font-size: 1.1rem;
      color: var(--primary-text);
      margin: 0 0 8px 0;
    }
    .empty-state p {
      font-size: 0.9rem;
      margin: 0 0 20px 0;
    }
    .btn-primary {
      background: var(--accent-green);
      color: #0F172A;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 9999px;
      border: none;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary:hover {
      background: #6EE7B7;
    }
  </style>
</head>
<body data-page="case-history">
  <!-- Navigation Bar -->
  <nav class="nav-bar">
    <a class="nav-brand" href="dashboard.html">
      <span>🐸</span>
      Frog Social
    </a>
    <div class="nav-links">
      <a href="dashboard.html">Home</a>
      <a href="case-intake.html">Describe a Problem</a>
      <a href="case-history.html" class="active">Case History</a>
      <a href="social.html">Social</a>
      <a href="colony-register.html">Colonies</a>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <span id="navUserBadge" style="font-size:0.82rem; color:#34D399; font-weight:500;"></span>
      <a href="#" class="nav-signout" id="navSignOut">Sign Out</a>
    </div>
  </nav>

  <div class="page-container">
    <div class="page-header">
      <div class="page-header-text">
        <h1>Case History</h1>
        <p>Track cases from intake through resolution. Resolved cases with detailed notes become learning resources for future troubleshooting.</p>
      </div>
      <div class="search-row">
        <input id="caseSearchInput" type="text" placeholder="Search by keyword, case #, symptom, outcome..." />
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">All</button>
          <button class="filter-tab" data-filter="open">Open</button>
          <button class="filter-tab" data-filter="resolved">Resolved</button>
        </div>
        <div class="filter-tabs">
          <button class="filter-tab active" data-sort="newest">Newest</button>
          <button class="filter-tab" data-sort="oldest">Oldest</button>
        </div>
      </div>
    </div>

    <!-- Stats bar -->
    <div class="stats-bar" id="statsBar">
      <div class="stat-item">
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">Total Cases</div>
      </div>
      <div class="stat-item open">
        <div class="stat-value" id="statOpen">0</div>
        <div class="stat-label">Open</div>
      </div>
      <div class="stat-item resolved">
        <div class="stat-value" id="statResolved">0</div>
        <div class="stat-label">Resolved</div>
      </div>
    </div>

    <!-- Case list -->
    <div class="case-list" id="caseList">
      <!-- Populated dynamically -->
    </div>
  </div>

  <script src="app-init.js"></script>
  <script>
    const API_BASE = (() => {
      const fromQuery = new URLSearchParams(window.location.search).get("apiBase");
      if (!fromQuery) return "";
      return fromQuery.replace(/\/+$/, "");
    })();

    // ─── Auth gate ──────────────────────────────────────────────
    function getAuthToken() { return localStorage.getItem("frogSocialToken") || ""; }
    function getAuthUser() {
      try { return JSON.parse(localStorage.getItem("frogSocialUser") || "null"); }
      catch { return null; }
    }
    if (!getAuthToken() || !getAuthUser()) { window.location.href = "login.html"; throw new Error("redirect"); }

    function authJsonHeaders() {
      const token = getAuthToken();
      const headers = { "Content-Type": "application/json" };
      if (token) headers["Authorization"] = `Bearer ${token}`;
      return headers;
    }

    (function initAuthNav() {
      const user = getAuthUser();
      const badge = document.getElementById("navUserBadge");
      if (badge && user) {
        badge.textContent = user.username ? `@${user.username}` : user.displayName;
      }
      const signOutLink = document.getElementById("navSignOut");
      if (signOutLink) {
        signOutLink.addEventListener("click", (e) => {
          e.preventDefault();
          localStorage.removeItem("frogSocialToken");
          localStorage.removeItem("frogSocialUser");
          window.location.href = "login.html";
        });
      }
    })();

    const showSeedOrTestCases = new URLSearchParams(window.location.search).get("showSeedOrTest") === "1";
    let currentFilter = "all";
    let resolvedOnly = false;
    let searchQuery = "";
    let sortDirection = "newest";
    let allCases = [];
    let archiveGapNote = "";

    function escapeHtml(text) {
      if (!text) return "";
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(isoString) {
      if (!isoString) return "Unknown";
      const date = new Date(isoString);
      return date.toLocaleString("en-US", {
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit",
      });
    }

    function normalizeCase(rawCase) {
      const statusRaw = String(rawCase.status || "OPEN").toUpperCase();
      const normalizedStatus =
        statusRaw === "RESOLVED" ? "resolved" : statusRaw === "MONITORING" ? "monitoring" : "unresolved";
      const caseId = rawCase.caseId || rawCase.id || "";
      const threadId = rawCase.threadId || rawCase.sourceThreadId || "";
      const rawTitle = String(rawCase.title || "Unlabeled Case");
      const prefersThreadLabel =
        Boolean(threadId) &&
        (rawTitle === "Unlabeled Case" || rawTitle.length > 90);
      return {
        id: caseId,
        caseId,
        caseNumber: Number(rawCase.caseNumber || 0),
        threadId,
        admissionState: rawCase.admissionState || (Boolean(rawCase.isSeedOrTest) ? "hidden" : "admitted"),
        isSeedOrTest: Boolean(rawCase.isSeedOrTest),
        title: prefersThreadLabel ? threadId : rawTitle,
        caseSummary: rawCase.caseSummary || rawCase.currentSystemStatus || rawCase.resolutionSummary || "",
        emergingThreads: Array.isArray(rawCase.emergingThreads) ? rawCase.emergingThreads : [],
        runningObservations: Array.isArray(rawCase.runningObservations) ? rawCase.runningObservations : [],
        currentStrategy: Array.isArray(rawCase.currentStrategy) ? rawCase.currentStrategy : [],
        suggestedNextSteps: Array.isArray(rawCase.suggestedNextSteps) ? rawCase.suggestedNextSteps : [],
        actionsTried: Array.isArray(rawCase.actionsTried) ? rawCase.actionsTried : [],
        domainsInPlay: Array.isArray(rawCase.domainsInPlay) ? rawCase.domainsInPlay : [],
        contributors: Array.isArray(rawCase.contributors) ? rawCase.contributors : [],
        worthinessPriorDiscussion: String(rawCase.worthinessPriorDiscussion || "").trim(),
        worthinessSharedProblem: String(rawCase.worthinessSharedProblem || "").trim(),
        worthinessAnalogies: Array.isArray(rawCase.worthinessAnalogies) ? rawCase.worthinessAnalogies : [],
        resolutionSummary: rawCase.resolutionSummary || "",
        caseUpdates: Array.isArray(rawCase.caseUpdates) ? rawCase.caseUpdates : [],
        currentStatus: rawCase.currentStatus || normalizedStatus,
        createdAt: rawCase.createdAt || "",
        updatedAt: rawCase.updatedAt || rawCase.createdAt || "",
        statusRaw,
        statusClass: normalizedStatus,
      };
    }

    async function loadCasesFromApi() {
      const response = await fetch(`${API_BASE}/api/cases`, { headers: authJsonHeaders() });
      if (!response.ok) {
        throw new Error(`Failed to load cases (${response.status})`);
      }
      const payload = await response.json();
      const mapped = Array.isArray(payload) ? payload.map(normalizeCase) : [];
      const admittedWithArchive = mapped.filter(
        (c) => c.admissionState === "admitted" && Number(c.caseNumber || 0) > 0 && Boolean(String(c.createdAt || "").trim())
      );
      archiveGapNote = "";
      const hasArchiveFields = (c) => Number(c.caseNumber || 0) > 0 && Boolean(String(c.createdAt || "").trim());
      const visible = showSeedOrTestCases
        ? mapped.filter(hasArchiveFields)
        : mapped.filter((c) => c.admissionState === "admitted" && hasArchiveFields(c));
      visible.sort((a, b) => new Date(b.updatedAt).getTime() - new Date(a.updatedAt).getTime());
      allCases = visible;
    }

    function updateStats() {
      const openCount = allCases.filter((c) => c.statusClass !== "resolved").length;
      const resolvedCount = allCases.filter((c) => c.statusRaw === "RESOLVED").length;
      document.getElementById("statTotal").textContent = String(allCases.length);
      document.getElementById("statOpen").textContent = String(openCount);
      document.getElementById("statResolved").textContent = String(resolvedCount);
      const bar = document.getElementById("statsBar");
      let noteEl = document.getElementById("archiveGapNote");
      if (!bar) return;
      if (!noteEl) {
        noteEl = document.createElement("div");
        noteEl.id = "archiveGapNote";
        noteEl.className = "archive-note";
        bar.appendChild(noteEl);
      }
      if (archiveGapNote) {
        noteEl.style.display = "block";
        noteEl.textContent = archiveGapNote;
      } else {
        noteEl.style.display = "none";
        noteEl.textContent = "";
      }
    }

    function buildSearchIndex(cases) {
      for (const c of cases) {
        c._haystack = [
          String(c.caseNumber || ""),
          c.title,
          c.caseSummary,
          c.currentStatus,
          c.resolutionSummary,
          formatDate(c.createdAt),
          formatDate(c.updatedAt),
          ...(c.tags || []),
          ...(c.runningObservations || []),
          ...(c.actionsTried || []),
          ...(c.contributors || []),
          ...(c.caseUpdates || []).map((u) => u.text),
        ].join(" ").toLowerCase();
        c._updatedTs = new Date(c.updatedAt).getTime();
      }
    }

    function getFilteredCases() {
      let scoped = allCases;
      if (resolvedOnly) {
        scoped = scoped.filter((c) => c.statusClass === "resolved");
      }
      if (currentFilter === "open") {
        scoped = scoped.filter((c) => c.statusClass !== "resolved");
      } else if (currentFilter === "resolved") {
        scoped = scoped.filter((c) => c.statusClass === "resolved");
      }

      const q = String(searchQuery || "").trim().toLowerCase();
      if (q) {
        const tokens = q.split(/\s+/);
        scoped = scoped.filter((c) => tokens.every((t) => c._haystack.includes(t)));
      }

      scoped.sort((a, b) =>
        sortDirection === "newest" ? b._updatedTs - a._updatedTs : a._updatedTs - b._updatedTs
      );

      return scoped;
    }

    const SECTION_LABEL_RE = /^\s*(Knowledge base|Current picture|Open points|Reported context|Context noted|GENERAL KNOWLEDGE|Recent outcomes|Uncertain factors|Observed signals|Still uncertain|Initial case description):\s*/i;

    function stripSectionLabels(text) {
      return String(text || "")
        .replace(/(Knowledge base:\s*){2,}/gi, "Knowledge base: ")
        .replace(/(Current picture:\s*){2,}/gi, "Current picture: ")
        .replace(/(Open points:\s*){2,}/gi, "Open points: ")
        .replace(/(Context noted:\s*){2,}/gi, "Context noted: ")
        .replace(/(Uncertain factors:\s*){2,}/gi, "Uncertain factors: ")
        .replace(/(Recent outcomes:\s*){2,}/gi, "Recent outcomes: ")
        .replace(SECTION_LABEL_RE, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function toPreview(text, max = 180) {
      const cleaned = stripSectionLabels(text);
      if (!cleaned) return "No case summary available yet.";
      if (cleaned.length <= max) return cleaned;
      return `${cleaned.slice(0, max - 3).trimEnd()}...`;
    }

    function sanitizeCaseLineText(text) {
      return stripSectionLabels(text);
    }

    function canonicalLineKey(text) {
      return sanitizeCaseLineText(String(text || ""))
        .replace(/^\s*\[(system|case|emerging)\]\s*/i, "")
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function compactUnique(items, maxItems = 4, maxLen = 140) {
      const seen = new Set();
      const out = [];
      for (const raw of Array.isArray(items) ? items : []) {
        const cleaned = sanitizeCaseLineText(raw);
        if (!cleaned) continue;
        if (!isRenderableCaseLine(cleaned)) continue;
        const key = canonicalLineKey(cleaned);
        if (!key) continue;
        if (seen.has(key)) continue;
        seen.add(key);
        out.push(cleaned.length > maxLen ? `${cleaned.slice(0, maxLen - 3).trimEnd()}...` : cleaned);
        if (out.length >= maxItems) break;
      }
      return out;
    }

    function isRenderableCaseLine(text) {
      const source = String(text || "").trim();
      if (!source) return false;
      const lower = source.toLowerCase();
      const blocked = [
        /^describe update for\b/,
        /^direct intake check\b/,
        /^update pass\b/,
        /^unified update test\b/,
        /^case note update\b/,
        /^second unified update test\b/,
        /^\d+(\.\d+)?[,;: ]+\s*conductivity\b/,
        /\bunify-e2e-\d+\b/,
        /^lab\s+[a-z0-9 _-]{2,60}\s+observed\b/,
      ];
      return !blocked.some((pattern) => pattern.test(lower));
    }

    function renderListOrFallback(items, fallback) {
      const compact = compactUnique(items, 4, 150);
      if (!compact.length) {
        return `<div class="report-body" style="color: var(--secondary-text);">${escapeHtml(fallback)}</div>`;
      }
      return `<ul class="report-list">${compact.map((item) => renderTaggedItem(item)).filter(Boolean).join("")}</ul>`;
    }

    function renderTaggedItem(raw) {
      const tagMatch = String(raw).match(/^\[(system|case|emerging)\]\s*/i);
      if (!tagMatch) {
        const cleaned = sanitizeCaseLineText(raw);
        return cleaned ? `<li>${escapeHtml(cleaned)}</li>` : "";
      }
      const basis = tagMatch[1].toLowerCase();
      const text = sanitizeCaseLineText(raw.slice(tagMatch[0].length));
      if (!text) return "";
      const badgeStyles = {
        system: "background:rgba(56,189,248,0.15);color:#38BDF8;",
        case: "background:rgba(52,211,153,0.15);color:#34D399;",
        emerging: "background:rgba(251,191,36,0.15);color:#FBBF24;",
      };
      const badgeLabels = {
        system: "system guidance",
        case: "case history",
        emerging: "emerging",
      };
      const style = badgeStyles[basis] || badgeStyles.emerging;
      const label = badgeLabels[basis] || basis;
      return `<li><span style="display:inline-block;font-size:0.6rem;font-weight:600;padding:1px 6px;border-radius:9999px;margin-right:6px;${style}">${escapeHtml(label)}</span>${escapeHtml(text)}</li>`;
    }

    const crossCaseCache = new Map();
    function buildCrossCaseCache(cases) {
      crossCaseCache.clear();
      for (const target of cases) {
        const targetDomainSet = new Set((target.domainsInPlay || []).map((d) => String(d || "").toLowerCase()));
        const scoreMap = new Map();
        for (const entry of cases) {
          if (entry.caseId === target.caseId) continue;
          const entryDomains = (entry.domainsInPlay || []).map((d) => String(d || "").toLowerCase());
          const sharedDomain = entryDomains.some((d) => targetDomainSet.has(d));
          const summaryOverlap = String(target.caseSummary || "").toLowerCase().split(/\s+/).some((token) =>
            token.length > 5 && String(entry.caseSummary || "").toLowerCase().includes(token)
          );
          if (!sharedDomain && !summaryOverlap) continue;
          const candidateSteps = compactUnique(
            [...(entry.currentStrategy || []), ...(entry.suggestedNextSteps || []), ...(entry.actionsTried || [])],
            6, 140
          );
          for (const step of candidateSteps) {
            const key = step.toLowerCase();
            scoreMap.set(key, { text: step, score: (scoreMap.get(key)?.score || 0) + 1 });
          }
        }
        crossCaseCache.set(target.caseId, Array.from(scoreMap.values())
          .sort((a, b) => b.score - a.score)
          .map((e) => /^\[(system|case|emerging)\]/i.test(e.text) ? e.text : `[case] ${e.text}`)
          .slice(0, 4)
        );
      }
    }

    function inferCrossCaseRecommendations(targetCase) {
      return crossCaseCache.get(targetCase.caseId) || [];
    }

    function dedupAgainst(items, referenceText) {
      if (!referenceText) return items;
      const refLower = referenceText.toLowerCase();
      return items.filter((item) => {
        const core = canonicalLineKey(item);
        return core.length < 10 || !refLower.includes(core.slice(0, 40));
      });
    }

    function buildFullCaseReport(caseRow, allVisibleCases) {
      const summaryText = String(caseRow.caseSummary || "").toLowerCase();
      const emerging = compactUnique(caseRow.emergingThreads, 4, 150);
      const collaborative = compactUnique(dedupAgainst(caseRow.runningObservations || [], caseRow.caseSummary), 5, 150);
      const focus = compactUnique(
        dedupAgainst(
          (caseRow.currentStrategy || []).length ? caseRow.currentStrategy : caseRow.suggestedNextSteps,
          caseRow.caseSummary
        ),
        5,
        150
      );
      const systemLearning = compactUnique(
        dedupAgainst(inferCrossCaseRecommendations(caseRow), caseRow.caseSummary),
        4,
        150
      );
      const tried = compactUnique(dedupAgainst(caseRow.actionsTried || [], caseRow.caseSummary), 5, 150);
      const activeNow = compactUnique([...focus, ...tried], 4, 150);
      const outcome = caseRow.resolutionSummary ? toPreview(caseRow.resolutionSummary, 320) : "Outcome not finalized yet.";
      const wPrior = String(caseRow.worthinessPriorDiscussion || "").trim();
      const wScale = String(caseRow.worthinessSharedProblem || "").trim();
      const wAnalog = Array.isArray(caseRow.worthinessAnalogies) ? caseRow.worthinessAnalogies.filter(Boolean) : [];
      const worthinessParagraph = (() => {
        if (!wPrior && !wScale && !wAnalog.length) {
          return "No case-worthiness assessment stored yet (populates when the LLM syncs this thread).";
        }
        const bits = [];
        if (wPrior) bits.push(`Prior discussion / recurrence: ${wPrior}`);
        if (wScale) bits.push(`Shared problem scale: ${wScale}`);
        if (wAnalog.length) bits.push(`Analogous contexts: ${wAnalog.join("; ")}`);
        return bits.join(" ");
      })();

      const section = (title, items, fallback, asParagraph = false) => {
        if (asParagraph) {
          return `<div style="margin-bottom:10px;"><strong>${escapeHtml(title)}:</strong> ${escapeHtml(items || fallback)}</div>`;
        }
        const rows = Array.isArray(items) ? items : [];
        if (!rows.length) {
          return `<div style="margin-bottom:10px;"><strong>${escapeHtml(title)}:</strong> ${escapeHtml(fallback)}</div>`;
        }
        return `<div style="margin-bottom:10px;"><strong>${escapeHtml(title)}:</strong><ul class="report-list">${rows
          .map((item) => `<li>${escapeHtml(item)}</li>`)
          .join("")}</ul></div>`;
      };

      return `
        ${section("Case description", toPreview(caseRow.caseSummary, 420), "No initial summary yet.", true)}
        ${section("Case worthiness signals", worthinessParagraph, "No worthiness signals yet.", true)}
        ${emerging.length ? section("Emerging threads", emerging, "") : ""}
        ${collaborative.length ? section("Social inputs", collaborative, "") : ""}
        ${focus.length ? section("Suggestions and recommendations", focus, "") : ""}
        ${systemLearning.length ? section("System learning from prior cases", systemLearning, "") : ""}
        ${section("Status and log", `Opened ${formatDate(caseRow.createdAt)}. Last update ${formatDate(caseRow.updatedAt)}. Current status ${caseRow.currentStatus || caseRow.statusRaw.toLowerCase()}. Contributors: ${(caseRow.contributors || []).join(", ") || "not listed"}.`, "", true)}
        ${activeNow.length ? section("Actions being taken now", activeNow, "") : ""}
        ${section("Final result / outcome", outcome, "Outcome not finalized yet.", true)}
        ${(caseRow.caseUpdates && caseRow.caseUpdates.length) ? section("Update log", caseRow.caseUpdates.map((u) => `[${u.type}] ${u.createdAt ? formatDate(u.createdAt) : ""} — ${toPreview(u.text, 200)}`), "") : ""}
      `;
    }

    function renderCases() {
      const container = document.getElementById("caseList");
      const filtered = getFilteredCases();

      if (!filtered.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">📋</div>
            <h3>No cases ${currentFilter !== "all" ? `(${currentFilter})` : ""} yet</h3>
            <p>Cases auto-created from active social threads will appear here.</p>
            <a href="social.html" class="btn-primary">Go to Social Feed</a>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map((c, index) => `
        <div class="case-card ${c.statusClass}">
          <div class="case-header">
            <div>
              <h3 class="case-title">Case ${c.caseNumber}: ${escapeHtml(c.title)}</h3>
              <div class="case-meta">
                First interaction ${formatDate(c.createdAt)} · Last updated ${formatDate(c.updatedAt)} · Thread ${escapeHtml(c.threadId || "n/a")}
              </div>
            </div>
            <span class="case-status ${c.statusClass}">${escapeHtml(c.statusClass)}</span>
          </div>
          <div class="case-description">${escapeHtml(toPreview(c.caseSummary))}</div>
          <div class="case-report-layout">
            <div>
              <div class="report-block">
                <div class="report-title">Case worthiness signals</div>
                <div class="report-body">${
                  (() => {
                    const p = String(c.worthinessPriorDiscussion || "").trim();
                    const s = String(c.worthinessSharedProblem || "").trim();
                    const a = Array.isArray(c.worthinessAnalogies) ? c.worthinessAnalogies.filter(Boolean) : [];
                    if (!p && !s && !a.length) {
                      return '<span style="color:var(--secondary-text);">No assessment stored yet.</span>';
                    }
                    let h = "";
                    if (p) h += `<div><strong>Prior discussion / recurrence:</strong> ${escapeHtml(toPreview(p, 300))}</div>`;
                    if (s) h += `<div style="margin-top:8px;"><strong>Shared problem scale:</strong> ${escapeHtml(toPreview(s, 300))}</div>`;
                    if (a.length) {
                      h += `<ul class="report-list" style="margin-top:8px;">${a.map((x) => `<li>${escapeHtml(toPreview(x, 200))}</li>`).join("")}</ul>`;
                    }
                    return h;
                  })()
                }</div>
              </div>
              ${(() => {
                const sumLower = String(c.caseSummary || "").toLowerCase();
                function dedupVsSummary(items) {
                  return (items || []).filter((item) => {
                    const k = canonicalLineKey(item);
                    return k.length < 10 || !sumLower.includes(k.slice(0, 40));
                  });
                }
                const emerging = compactUnique(dedupVsSummary(c.emergingThreads), 4, 150);
                const social = compactUnique(dedupVsSummary(c.runningObservations), 5, 150);
                const recs = compactUnique(dedupVsSummary((c.currentStrategy || []).length ? c.currentStrategy : c.suggestedNextSteps), 5, 150);
                const xCase = compactUnique(dedupVsSummary(inferCrossCaseRecommendations(c)), 4, 150);
                const tried = compactUnique(dedupVsSummary(c.actionsTried), 5, 150);
                let out = "";
                if (emerging.length) out += `<div class="report-block"><div class="report-title">Emerging Threads</div>${renderListOrFallback(emerging, "")}</div>`;
                if (social.length) out += `<div class="report-block"><div class="report-title">Social Inputs</div>${renderListOrFallback(social, "")}</div>`;
                if (recs.length) out += `<div class="report-block"><div class="report-title">Recommendations</div>${renderListOrFallback(recs, "")}</div>`;
                if (xCase.length) out += `<div class="report-block"><div class="report-title">System Learning from Other Cases</div>${renderListOrFallback(xCase, "")}</div>`;
                if (tried.length) out += `<div class="report-block"><div class="report-title">What Has Been Tried</div>${renderListOrFallback(tried, "")}</div>`;
                return out;
              })()}
              <div class="report-block">
                <div class="report-title">Case Log / Status</div>
                <div class="report-body">
                  Opened: ${escapeHtml(formatDate(c.createdAt))}<br />
                  Last update: ${escapeHtml(formatDate(c.updatedAt))}<br />
                  Current status: ${escapeHtml(c.statusClass)}<br />
                  Contributors: ${escapeHtml((c.contributors || []).join(", ") || "not listed")}
                </div>
              </div>
              <div class="report-block">
                <div class="report-title">Outcome</div>
                <div class="report-body">${escapeHtml(c.resolutionSummary ? toPreview(c.resolutionSummary, 320) : "Outcome not finalized yet.")}</div>
              </div>
            </div>
            <div class="report-block full-status-window">
              <div class="report-title">Full Case Status</div>
              <div class="report-body">${buildFullCaseReport(c, filtered)}</div>
            </div>
            ${(c.caseUpdates && c.caseUpdates.length) ? `
            <div class="report-block" style="grid-column: 1 / -1;">
              <div class="report-title">Case Updates (${c.caseUpdates.length})</div>
              <div class="report-body">
                ${c.caseUpdates.map((u) => `<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);">
                  <span style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.04em;color:${u.type === 'resolution' ? 'var(--accent-green)' : 'var(--accent-cyan)'};">${escapeHtml(u.type)}</span>
                  <span style="font-size:0.7rem;color:var(--secondary-text);margin-left:8px;">${escapeHtml(u.userId || "")} · ${u.createdAt ? escapeHtml(formatDate(u.createdAt)) : ""}</span>
                  <div style="font-size:0.82rem;color:var(--primary-text);margin-top:4px;line-height:1.5;">${escapeHtml(toPreview(u.text, 400))}</div>
                </div>`).join("")}
              </div>
            </div>` : ""}
          </div>
          <div class="case-actions">
            <button class="btn-secondary" data-case-id="${escapeHtml(c.id)}" onclick="toggleNoteForm(this.dataset.caseId)">Add Note</button>
            <button class="btn-secondary" data-thread-id="${escapeHtml(c.threadId || "")}" onclick="viewOnSocial(this.dataset.threadId)">Open Thread</button>
            <button class="btn-secondary" data-thread-id="${escapeHtml(c.threadId || "")}" data-title="${escapeHtml(c.title || "")}" onclick="updateFromDescribe(this.dataset.threadId, this.dataset.title)">Update in Describe</button>
            <button class="btn-secondary" style="background:rgba(52,211,153,0.15);color:#6EE7B7;border-color:rgba(52,211,153,0.4);" data-case-id="${escapeHtml(c.id)}" onclick="toggleResolutionForm(this.dataset.caseId)">Update Status / Resolve</button>
          </div>
          <div class="case-note-form" id="note-form-${escapeHtml(c.id)}" style="display:none; margin-top:12px; padding:16px; background:rgba(15,23,42,0.6); border:1px solid rgba(255,255,255,0.08); border-radius:12px;">
            <div style="margin-bottom:10px; font-size:0.85rem; font-weight:600; color:var(--primary-text);">Add a note to this case</div>
            <select id="note-type-${escapeHtml(c.id)}" style="background:#0F172A; border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:8px 10px; font-size:0.82rem; color:var(--primary-text); margin-bottom:10px; width:100%;">
              <option value="update">Update / progress note</option>
              <option value="observation">Observation</option>
              <option value="outcome">Outcome / resolution note</option>
              <option value="follow-up">Follow-up</option>
            </select>
            <textarea id="note-text-${escapeHtml(c.id)}" rows="4" placeholder="What happened? What did you observe? What changed?" style="width:100%;background:#0F172A;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px;font-size:0.85rem;color:var(--primary-text);font-family:inherit;resize:vertical;margin-bottom:10px;"></textarea>
            <div style="display:flex; gap:8px; align-items:center;">
              <button class="btn-secondary submit-note-btn" data-case-id="${escapeHtml(c.id)}" style="background:rgba(52,211,153,0.2);color:#6EE7B7;">Submit note</button>
              <span id="note-status-${escapeHtml(c.id)}" style="font-size:0.75rem;color:var(--secondary-text);"></span>
            </div>
          </div>
          <div class="resolution-form" id="resolution-form-${escapeHtml(c.id)}" style="display:none; margin-top:12px; padding:16px; background:rgba(15,23,42,0.6); border:1px solid rgba(255,255,255,0.08); border-radius:12px;">
            <div style="margin-bottom:10px; font-size:0.85rem; font-weight:600; color:var(--primary-text);">Update Case Status</div>
            <div style="display:flex; gap:8px; margin-bottom:10px;">
              <button class="btn-secondary resolution-status-btn" data-status="RESOLVED" data-case-id="${escapeHtml(c.id)}" style="background:rgba(52,211,153,0.2);color:#6EE7B7;">Resolved</button>
              <button class="btn-secondary resolution-status-btn" data-status="MONITORING" data-case-id="${escapeHtml(c.id)}" style="background:rgba(56,189,248,0.2);color:#38BDF8;">Monitoring</button>
              <button class="btn-secondary resolution-status-btn" data-status="OPEN" data-case-id="${escapeHtml(c.id)}" style="background:rgba(251,146,60,0.2);color:#FB923C;">Still Open</button>
            </div>
            <textarea id="resolution-text-${escapeHtml(c.id)}" rows="3" placeholder="What was tried? What worked? What is the current state?" style="width:100%;background:#0F172A;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px;font-size:0.85rem;color:var(--primary-text);font-family:inherit;resize:vertical;margin-bottom:10px;"></textarea>
            <div id="resolution-status-${escapeHtml(c.id)}" style="font-size:0.75rem;color:var(--secondary-text);"></div>
          </div>
        </div>
      `).join("");
    }

    window.viewOnSocial = function(threadId) {
      const safeThreadId = String(threadId || "").trim();
      if (!safeThreadId) {
        window.location.href = "social.html";
        return;
      }
      window.location.href = `social.html?threadId=${encodeURIComponent(safeThreadId)}`;
    };

    window.updateFromDescribe = function(threadId, title) {
      const safeThreadId = String(threadId || "").trim();
      const safeTitle = String(title || "").trim();
      const qs = new URLSearchParams();
      if (safeThreadId) qs.set("threadId", safeThreadId);
      if (safeTitle) qs.set("title", safeTitle);
      const suffix = qs.toString() ? `?${qs.toString()}` : "";
      window.location.href = `case-intake.html${suffix}`;
    };

    window.toggleResolutionForm = function(caseId) {
      const form = document.getElementById(`resolution-form-${caseId}`);
      if (form) {
        form.style.display = form.style.display === "none" ? "block" : "none";
      }
    };

    window.toggleNoteForm = function(caseId) {
      const form = document.getElementById(`note-form-${caseId}`);
      if (form) {
        form.style.display = form.style.display === "none" ? "block" : "none";
      }
    };

    document.addEventListener("click", async (e) => {
      const btn = e.target.closest(".submit-note-btn");
      if (!btn) return;
      const caseId = btn.dataset.caseId;
      const textEl = document.getElementById(`note-text-${caseId}`);
      const typeEl = document.getElementById(`note-type-${caseId}`);
      const statusEl = document.getElementById(`note-status-${caseId}`);
      const noteText = textEl ? textEl.value.trim() : "";
      const noteType = typeEl ? typeEl.value : "update";

      if (!noteText) {
        if (statusEl) statusEl.textContent = "Please enter a note before submitting.";
        return;
      }

      const prefixed = `[${noteType}] ${noteText}`;
      const isResolution = noteType === "outcome";

      btn.disabled = true;
      if (statusEl) statusEl.textContent = "Submitting...";

      try {
        const endpoint = isResolution
          ? `${API_BASE}/api/cases/${encodeURIComponent(caseId)}/resolution`
          : `${API_BASE}/api/cases/${encodeURIComponent(caseId)}/follow-up`;
        const body = isResolution
          ? { outcome: "MONITORING", freeText: noteText }
          : { responseText: prefixed };

        const response = await fetch(endpoint, {
          method: "POST",
          headers: authJsonHeaders(),
          body: JSON.stringify(body),
        });
        if (response.status === 401) { window.location.href = "login.html"; return; }
        if (!response.ok) throw new Error(`Failed (${response.status})`);

        if (statusEl) statusEl.textContent = "Note added. Reloading cases...";
        textEl.value = "";
        setTimeout(async () => {
          await loadCasesFromApi();
          buildSearchIndex(allCases);
          buildCrossCaseCache(allCases);
          updateStats();
          renderCases();
        }, 800);
      } catch (err) {
        if (statusEl) statusEl.textContent = `Error: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    });

    document.addEventListener("click", async (e) => {
      const btn = e.target.closest(".resolution-status-btn");
      if (!btn) return;
      const caseId = btn.dataset.caseId;
      const status = btn.dataset.status;
      const textEl = document.getElementById(`resolution-text-${caseId}`);
      const statusEl = document.getElementById(`resolution-status-${caseId}`);
      const freeText = textEl ? textEl.value.trim() : "";

      if (!freeText && status === "RESOLVED") {
        if (statusEl) statusEl.textContent = "Please describe what worked before marking as resolved.";
        return;
      }

      if (statusEl) statusEl.textContent = "Submitting...";
      try {
        const response = await fetch(`${API_BASE}/api/cases/${encodeURIComponent(caseId)}/resolution`, {
          method: "POST",
          headers: authJsonHeaders(),
          body: JSON.stringify({ outcome: status, freeText }),
        });
        if (response.status === 401) {
          window.location.href = "login.html";
          return;
        }
        if (!response.ok) throw new Error(`Failed (${response.status})`);
        if (statusEl) statusEl.textContent = `Status updated to ${status}. Reloading...`;
        setTimeout(async () => {
          await loadCasesFromApi();
          buildSearchIndex(allCases);
          buildCrossCaseCache(allCases);
          updateStats();
          renderCases();
        }, 1000);
      } catch (err) {
        if (statusEl) statusEl.textContent = `Error: ${err.message}`;
      }
    });

    document.querySelectorAll(".filter-tab[data-filter]").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".filter-tab[data-filter]").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        currentFilter = tab.dataset.filter;
        renderCases();
      });
    });

    document.getElementById("caseSearchInput").addEventListener("input", (event) => {
      searchQuery = String(event.target.value || "");
      renderCases();
    });

    document.querySelectorAll(".filter-tab[data-sort]").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-tab[data-sort]").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        sortDirection = btn.dataset.sort;
        renderCases();
      });
    });

    (async function init() {
      const container = document.getElementById("caseList");
      try {
        await loadCasesFromApi();
        buildSearchIndex(allCases);
        buildCrossCaseCache(allCases);
        updateStats();
        renderCases();
      } catch (error) {
        updateStats();
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">⚠️</div>
            <h3>Unable to load cases</h3>
            <p>${escapeHtml(error instanceof Error ? error.message : "Backend unavailable")}</p>
          </div>
        `;
      }
    })();
  </script>
</body>
</html>
